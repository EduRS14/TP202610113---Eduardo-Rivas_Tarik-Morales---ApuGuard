# nginx.conf — APU GUARD (Fase C + D)
# Sirve el build de Angular y hace de reverse proxy hacia gunicorn.
# El nombre `web` se resuelve con el DNS embebido de Docker (127.0.0.11)
# en cada peticion, no al cargar la configuracion: asi nginx arranca aunque
# el contenedor web todavia no exista y recupera si la IP cambia.

# -- Protoculo real del cliente (Fase D) --------------------------------
# Detras de CloudFront, el cliente habla HTTPS con CloudFront y CloudFront
# habla HTTP con nosotros (nginx escucha el 80). CloudFront NO reenvia
# X-Forwarded-Proto: anade el suyo, CloudFront-Forwarded-Proto.
# Si aqui siguiera $scheme, X-Forwarded-Proto seria siempre "http" y con
# SECURE_SSL_REDIRECT=True Django devolveria un 301 a https:// sobre un
# origen que no tiene TLS -> CloudFront no puede seguir -> BUCLE.
# map vive en el contexto http: este fichero se incluye desde
# /etc/nginx/conf.d/*.conf dentro de http {}, asi que es legal aqui.
map $http_cloudfront_forwarded_proto $fwd_proto {
    # Sin cabecera (consulta local o viajecura) -> usar el esquema real.
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    root  /usr/share/nginx/html;
    index index.html;

    # Las evidencias van directo a S3 con URL presignada; por aqui solo
    # circulan JSON. Se deja holgura por si algo cambia.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/xml
        application/xml+rss;

    # -- Reverse proxy hacia Django (gunicorn) -----------------------------
    location ~ ^/(api|admin|static|media)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://web:8000;

        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;   # igual que WEB_TIMEOUT
        proxy_send_timeout    120s;
        proxy_buffering off;
    }

    # -- Archivos con fingerprint del build (angular.json: outputHashing all)
    # El nombre cambia en cada build, asi que pueden cachearse indefinidamente.
    # Exige el guion y los 8 caracteres de hash antes de la extension: no
    # atrapa a favicon.ico ni a assets/logo.jpeg.
    location ~* "-[\w]{8}\.(js|mjs|css|map|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|avif)$" {
        # Un solo header: `expires` + `add_header` generarian dos Cache-Control.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # -- Assets copiados tal cual (src/assets): sin fingerprint, cache corta.
    # El prefijo ^~ tiene prioridad sobre las expresiones regulares.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # index.html nunca se cachea: es lo que decide que version corre.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # -- SPA fallback: cualquier ruta de Angular resuelve en index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
